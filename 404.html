<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CONTROL · Urology Scientific Symposium</title>
    <script>
      (function () {
        var parts = window.location.pathname.split("/").filter(Boolean);
        var base = "/" + (parts[0] || "control");
        var route = window.location.pathname.slice(base.length) + window.location.search + window.location.hash;
        window.location.replace(base + "/?route=" + encodeURIComponent(route));
      })();
    </script>
  </head>
  <body></body>
</html>
